name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff
        run: | 
          uv run ruff check src
          uv run ruff format --check src

      - name: Run Mypy
        run: |
          uv run mypy src
          uv run mypy tests

      - name: Run Pytest with Coverage
        run: |
          uv run pytest --cov=src --cov-report=term --maxfail=1 --cov-fail-under=100
          uv run coverage report -m
