[project]
name = "rag-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "gradio>=5.33.0",
    "langchain>=0.3.25",
    "langchain-openai>=0.3.19",
    "mypy>=1.16.0",
